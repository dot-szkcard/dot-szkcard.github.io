    <!-- JavaScript -->
    <script>
        const BG_HEIGHT_FACTOR = 1.6;

        function updateBackgroundScroll() {
            if (window.innerWidth < 768) {
                document.body.style.backgroundAttachment = 'fixed';
                document.body.style.backgroundSize = '100% auto';
                document.body.style.backgroundPositionY = '0px';
                return;
            }

            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;

            if (!window._bgNatural) {
                const img = new Image();
                img.src = 'bg.png';
                img.onload = function() {
                    window._bgNatural = { w: img.naturalWidth, h: img.naturalHeight };
                    updateBackgroundScroll();
                };
                document.body.style.backgroundSize = '100% auto';
                return;
            }

            const natural = window._bgNatural;
            const bgHeight = Math.round(viewportWidth * natural.h / natural.w);
            document.body.style.backgroundSize = '100% ' + bgHeight + 'px';

            const scrollableHeight = document.documentElement.scrollHeight - viewportHeight;
            const maxBgOffset = Math.max(bgHeight - viewportHeight, 0);

            if (scrollableHeight <= 0 || maxBgOffset <= 0) {
                document.body.style.backgroundPositionY = '0px';
                return;
            }

            const scrollFraction = Math.min(Math.max(window.scrollY / scrollableHeight, 0), 1);
            document.body.style.backgroundPositionY = '-' + (scrollFraction * maxBgOffset) + 'px';
        }

        window.addEventListener('scroll', updateBackgroundScroll);
        window.addEventListener('resize', updateBackgroundScroll);
        window.addEventListener('load', updateBackgroundScroll);
        updateBackgroundScroll();

        const hamburgerBtn = document.getElementById('hamburger-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        const menuLinks = document.querySelectorAll('.menu-link');

        function toggleMenu() {
            const isActive = hamburgerBtn.classList.toggle('active');
            mobileMenu.classList.toggle('active');
            hamburgerBtn.setAttribute('aria-expanded', isActive ? 'true' : 'false');
            mobileMenu.setAttribute('aria-hidden', isActive ? 'false' : 'true');
        }

        hamburgerBtn.addEventListener('click', toggleMenu);

        menuLinks.forEach(link => {
            link.addEventListener('click', toggleMenu);
        });

        const mobileMenuCloseBtn = document.getElementById('mobile-menu-close');
        if (mobileMenuCloseBtn) {
            mobileMenuCloseBtn.addEventListener('click', () => {
                if (mobileMenu.classList.contains('active')) toggleMenu();
            });
        }

        hamburgerBtn.setAttribute('aria-expanded', 'false');
        mobileMenu.setAttribute('aria-hidden', 'true');
    </script>
